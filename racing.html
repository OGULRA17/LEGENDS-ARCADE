<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Racing - Legends Arcade</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #0b0b16;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            margin-top: 25px;
            color: #00ffff;
            text-shadow: 0 0 15px #00ffff;
        }

        #score {
            font-size: 20px;
            margin: 10px;
        }

        canvas {
            background: #222;
            border: 3px solid #00ffff;
            border-radius: 12px;
            box-shadow: 0 0 20px #00ffff;
            max-width: 90%;
        }

        button {
            border: none;
            padding: 12px 25px;
            margin: 12px 6px;
            border-radius: 25px;
            background: #00ffff;
            color: black;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px #00ffff;
        }

    </style>

</head>

<body>

    <h1>🚗 RACING</h1>

    <div id="score">
        Score: 0
    </div>

    <canvas
        id="gameCanvas"
        width="400"
        height="600">
    </canvas>

    <br>

    <button onclick="restart()">
        🔄 RESTART
    </button>

    <button onclick="window.location.href='../index.html'">
        🏠 BACK TO ARCADE
    </button>


    <script>

        const canvas =
            document.getElementById("gameCanvas");

        const ctx =
            canvas.getContext("2d");

        const scoreText =
            document.getElementById("score");


        let car;
        let enemies;
        let score;
        let gameOver;
        let roadY;


        function startGame() {

            car = {

                x: 175,
                y: 500,
                width: 50,
                height: 80,
                speed: 7

            };


            enemies = [];

            score = 0;

            gameOver = false;

            roadY = 0;


            scoreText.textContent =
                "Score: 0";


            requestAnimationFrame(gameLoop);

        }


        function drawRoad() {

            // Road

            ctx.fillStyle = "#333";

            ctx.fillRect(
                50,
                0,
                300,
                canvas.height
            );


            // Grass

            ctx.fillStyle = "#111";

            ctx.fillRect(
                0,
                0,
                50,
                canvas.height
            );

            ctx.fillRect(
                350,
                0,
                50,
                canvas.height
            );


            // Road lines

            ctx.strokeStyle = "#fff";

            ctx.lineWidth = 5;


            for (
                let y = -40 + roadY;
                y < canvas.height;
                y += 80
            ) {

                ctx.beginPath();

                ctx.moveTo(198, y);

                ctx.lineTo(198, y + 40);

                ctx.stroke();

            }

        }


        function drawCar() {

            // Main car

            ctx.fillStyle = "#00ffff";

            ctx.fillRect(
                car.x,
                car.y,
                car.width,
                car.height
            );


            // Window

            ctx.fillStyle = "#111";

            ctx.fillRect(
                car.x + 8,
                car.y + 10,
                34,
                22
            );


            // Wheels

            ctx.fillStyle = "#000";

            ctx.fillRect(
                car.x - 5,
                car.y + 10,
                7,
                20
            );

            ctx.fillRect(
                car.x + 48,
                car.y + 10,
                7,
                20
            );

            ctx.fillRect(
                car.x - 5,
                car.y + 50,
                7,
                20
            );

            ctx.fillRect(
                car.x + 48,
                car.y + 50,
                7,
                20
            );

        }


        function createEnemy() {

            const lanes = [
                80,
                175,
                270
            ];


            const randomLane =
                lanes[
                    Math.floor(
                        Math.random() * lanes.length
                    )
                ];


            enemies.push({

                x: randomLane,

                y: -90,

                width: 50,

                height: 80,

                speed:
                    4 + Math.random() * 2

            });

        }


        function drawEnemies() {

            enemies.forEach(function(enemy) {

                ctx.fillStyle = "#ff3333";

                ctx.fillRect(
                    enemy.x,
                    enemy.y,
                    enemy.width,
                    enemy.height
                );


                ctx.fillStyle = "#111";

                ctx.fillRect(
                    enemy.x + 8,
                    enemy.y + 10,
                    34,
                    22
                );

            });

        }


        function collision(car, enemy) {

            return (

                car.x <
                enemy.x + enemy.width &&

                car.x + car.width >
                enemy.x &&

                car.y <
                enemy.y + enemy.height &&

                car.y + car.height >
                enemy.y

            );

        }


        function update() {

            roadY += 6;


            if (roadY >= 80) {

                roadY = 0;

            }


            enemies.forEach(function(enemy) {

                enemy.y += enemy.speed;

            });


            enemies =
                enemies.filter(function(enemy) {

                    if (
                        enemy.y > canvas.height
                    ) {

                        score += 10;

                        scoreText.textContent =
                            "Score: " + score;

                        return false;

                    }

                    return true;

                });


            // Create enemies

            if (
                Math.random() < 0.02
            ) {

                createEnemy();

            }


            // Collision

            enemies.forEach(function(enemy) {

                if (
                    collision(car, enemy)
                ) {

                    gameOver = true;

                }

            });

        }


        function gameLoop() {

            if (gameOver) {

                ctx.clearRect(
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );


                drawRoad();

                drawEnemies();

                drawCar();


                ctx.fillStyle = "#00ffff";

                ctx.font = "40px Arial";

                ctx.textAlign = "center";

                ctx.fillText(
                    "GAME OVER",
                    canvas.width / 2,
                    280
                );


                ctx.font = "22px Arial";

                ctx.fillText(
                    "Score: " + score,
                    canvas.width / 2,
                    320
                );


                return;

            }


            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            update();

            drawRoad();

            drawEnemies();

            drawCar();


            requestAnimationFrame(gameLoop);

        }


        function restart() {

            startGame();

        }


        document.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "ArrowLeft" ||
                    event.key.toLowerCase() === "a"
                ) {

                    car.x -= car.speed;

                }


                if (
                    event.key === "ArrowRight" ||
                    event.key.toLowerCase() === "d"
                ) {

                    car.x += car.speed;

                }


                if (car.x < 55) {

                    car.x = 55;

                }


                if (car.x > 295) {

                    car.x = 295;

                }

            }
        );


        startGame();

    </script>

</body>

</html>
