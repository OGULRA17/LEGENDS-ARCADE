<body>

```
<h1>🐍 SNAKE</h1>

<div id="score">
    Score: 0
</div>

<div id="best">
    🏆 Best Score: 0
</div>

<canvas id="game" width="400" height="400"></canvas>


<div class="controls">

    <div>
        <button onclick="changeDirection('up')">
            ⬆️
        </button>
    </div>

    <div>
        <button onclick="changeDirection('left')">
            ⬅️
        </button>

        <button onclick="changeDirection('down')">
            ⬇️
        </button>

        <button onclick="changeDirection('right')">
            ➡️
        </button>
    </div>

</div>


<div class="menu">

    <button onclick="restart()">
        🔄 RESTART
    </button>

    <button onclick="window.location.href='../index.html'">
        🏠 BACK TO ARCADE
    </button>

</div>


<script>

    const canvas =
        document.getElementById("game");

    const ctx =
        canvas.getContext("2d");

    const scoreText =
        document.getElementById("score");

    const bestText =
        document.getElementById("best");


    const grid = 20;

    const tileCount = 20;


    let snake;

    let food;

    let dx;

    let dy;

    let score;

    let gameOver;


    let bestScore =
        Number(localStorage.getItem("snakeBestScore")) || 0;


    bestText.textContent =
        "🏆 Best Score: " + bestScore;


    function startGame() {

        snake = [

            {
                x: 200,
                y: 200
            },

            {
                x: 180,
                y: 200
            },

            {
                x: 160,
                y: 200
            }

        ];


        dx = grid;

        dy = 0;

        score = 0;

        gameOver = false;


        scoreText.textContent =
            "Score: 0";


        createFood();

    }


    function createFood() {

        food = {

            x:
                Math.floor(
                    Math.random() * tileCount
                ) * grid,

            y:
                Math.floor(
                    Math.random() * tileCount
                ) * grid

        };


        for (let part of snake) {

            if (
                part.x === food.x &&
                part.y === food.y
            ) {

                createFood();

                return;

            }

        }

    }


    function changeDirection(direction) {

        if (direction === "up" && dy === 0) {

            dx = 0;

            dy = -grid;

        }


        if (direction === "down" && dy === 0) {

            dx = 0;

            dy = grid;

        }


        if (direction === "left" && dx === 0) {

            dx = -grid;

            dy = 0;

        }


        if (direction === "right" && dx === 0) {

            dx = grid;

            dy = 0;

        }

    }


    document.addEventListener(
        "keydown",
        function(event) {

            if (event.key === "ArrowUp") {

                changeDirection("up");

            }

            if (event.key === "ArrowDown") {

                changeDirection("down");

            }

            if (event.key === "ArrowLeft") {

                changeDirection("left");

            }

            if (event.key === "ArrowRight") {

                changeDirection("right");

            }

        }
    );


    function draw() {

        if (gameOver) {

            drawGameOver();

            return;

        }


        ctx.fillStyle = "#10101d";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        // Food

        ctx.fillStyle = "#ff3333";

        ctx.beginPath();

        ctx.arc(
            food.x + 10,
            food.y + 10,
            8,
            0,
            Math.PI * 2
        );

        ctx.fill();


        // Snake

        snake.forEach(function(part, index) {

            if (index === 0) {

                ctx.fillStyle = "#00ffff";

            } else {

                ctx.fillStyle = "#00aa99";

            }

            ctx.fillRect(
                part.x + 1,
                part.y + 1,
                grid - 2,
                grid - 2
            );

        });


        let head = {

            x: snake[0].x + dx,

            y: snake[0].y + dy

        };


        // Wall collision

        if (

            head.x < 0 ||

            head.x >= canvas.width ||

            head.y < 0 ||

            head.y >= canvas.height

        ) {

            endGame();

            return;

        }


        // Self collision

        for (let part of snake) {

            if (
                head.x === part.x &&
                head.y === part.y
            ) {

                endGame();

                return;

            }

        }


        snake.unshift(head);


        // Eat food

        if (
            head.x === food.x &&
            head.y === food.y
        ) {

            score += 10;

            scoreText.textContent =
                "Score: " + score;


            if (score > bestScore) {

                bestScore = score;

                localStorage.setItem(
                    "snakeBestScore",
                    bestScore
                );

                bestText.textContent =
                    "🏆 Best Score: " + bestScore;

            }


            createFood();

        } else {

            snake.pop();

        }

    }


    function endGame() {

        gameOver = true;

        drawGameOver();

    }


    function drawGameOver() {

        ctx.fillStyle =
            "rgba(0, 0, 0, 0.75)";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        ctx.fillStyle = "#00ffff";

        ctx.font = "38px Arial";

        ctx.textAlign = "center";

        ctx.fillText(
            "GAME OVER",
            canvas.width / 2,
            180
        );


        ctx.font = "22px Arial";

        ctx.fillText(
            "Score: " + score,
            canvas.width / 2,
            225
        );


        ctx.fillText(
            "Press RESTART",
            canvas.width / 2,
            265
        );

    }


    function restart() {

        startGame();

    }


    startGame();


    setInterval(
        draw,
        120
    );

</script>
```

</body>

</html>
