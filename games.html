<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Games - Legends Arcade</title>

    <!-- WOLF FAVICON -->
    <link rel="icon" type="image/webp" href="wolf.webp">

    <link rel="stylesheet" href="style.css">

</head>

<body>


    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">
            🎮 LEGENDS
        </div>

        <div class="nav-links">

            <a href="index.html">
                HOME
            </a>

            <a href="games.html">
                GAMES
            </a>

        </div>

    </nav>


    <!-- HEADER -->

    <header>

        <h1>
            🎮 CHOOSE YOUR GAME
        </h1>

        <p>
            PLAY • COMPETE • HAVE FUN
        </p>

    </header>


    <!-- GAMES -->

    <main id="games">

        <div class="games">


            <!-- SNAKE -->

            <div class="game-card">

                <span>🐍</span>

                <h3>Snake</h3>

                <p>
                    Classic snake game
                </p>

                <button
                    onclick="window.location.href='games/snake.html'">

                    PLAY

                </button>

            </div>


            <!-- TIC TAC TOE -->

            <div class="game-card">

                <span>❌⭕</span>

                <h3>Tic-Tac-Toe</h3>

                <p>
                    Beat your opponent
                </p>

                <button
                    onclick="window.location.href='games/tictactoe.html'">

                    PLAY

                </button>

            </div>


            <!-- MEMORY -->

            <div class="game-card">

                <span>🧠</span>

                <h3>Memory Cards</h3>

                <p>
                    Find the matching pairs
                </p>

                <button
                    onclick="window.location.href='games/memory.html'">

                    PLAY

                </button>

            </div>


            <!-- BREAKOUT -->

            <div class="game-card">

                <span>🧱</span>

                <h3>Breakout</h3>

                <p>
                    Break all the bricks
                </p>

                <button
                    onclick="window.location.href='games/breakout.html'">

                    PLAY

                </button>

            </div>


            <!-- RACING -->

            <div class="game-card">

                <span>🚗</span>

                <h3>Racing</h3>

                <p>
                    Avoid the enemy cars
                </p>

                <button
                    onclick="window.location.href='games/racing.html'">

                    PLAY

                </button>

            </div>


        </div>

    </main>


    <!-- FOOTER -->

    <footer>

        <p>
            MINI ARCADE GAME CREATED BY YAHYA BRAKECH
        </p>

    </footer>


</body>

</html>
