<title>Memory Cards - Legends Arcade</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background: #0b0b16;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
    }

    h1 {
        margin-top: 30px;
        color: #00ffff;
        text-shadow: 0 0 15px #00ffff;
    }

    #status {
        font-size: 20px;
        margin: 15px;
    }

    #score {
        color: #ffd700;
        font-size: 18px;
        margin: 10px;
    }

    .game {
        width: 420px;
        max-width: 90%;
        margin: 25px auto;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
    }

    .card {
        height: 90px;
        background: #151525;
        border: 2px solid #29294a;
        border-radius: 12px;
        font-size: 40px;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        transition: 0.2s;
    }

    .card:hover {
        border-color: #00ffff;
        box-shadow: 0 0 15px #00ffff;
    }

    .card.hidden {
        font-size: 0;
        background: #10101d;
    }

    .card.matched {
        border-color: #00ff88;
        box-shadow: 0 0 15px #00ff88;
    }

    button {
        border: none;
        padding: 12px 25px;
        margin: 8px;
        border-radius: 25px;
        background: #00ffff;
        color: black;
        font-weight: bold;
        cursor: pointer;
        font-size: 15px;
    }

    button:hover {
        transform: scale(1.05);
        box-shadow: 0 0 20px #00ffff;
    }
</style>

```
<h1>🧠 MEMORY CARDS</h1>

<div id="status">
    Find all the matching pairs!
</div>

<div id="score">
    🏆 Pairs: 0 / 8
</div>

<div class="game" id="game"></div>

<button onclick="restart()">
    🔄 RESTART
</button>

<button onclick="window.location.href='../index.html'">
    🏠 BACK TO ARCADE
</button>

<script>

    const symbols = [
        "🍎", "🍎",
        "🍕", "🍕",
        "🚗", "🚗",
        "⚽", "⚽",
        "🎮", "🎮",
        "🚀", "🚀",
        "👾", "👾",
        "💎", "💎"
    ];

    let firstCard = null;
    let secondCard = null;
    let lockBoard = false;
    let matches = 0;

    const game =
        document.getElementById("game");

    const statusText =
        document.getElementById("status");

    const scoreText =
        document.getElementById("score");


    function shuffle(array) {

        for (
            let i = array.length - 1;
            i > 0;
            i--
        ) {

            let j =
                Math.floor(
                    Math.random() * (i + 1)
                );

            [array[i], array[j]] =
                [array[j], array[i]];

        }

    }


    function createGame() {

        game.innerHTML = "";

        firstCard = null;
        secondCard = null;
        lockBoard = false;
        matches = 0;

        scoreText.textContent =
            "🏆 Pairs: 0 / 8";


        let shuffled = [...symbols];

        shuffle(shuffled);


        shuffled.forEach(function(symbol) {

            const card =
                document.createElement("div");

            card.classList.add(
                "card",
                "hidden"
            );

            card.textContent = symbol;

            card.onclick = function() {

                flipCard(card);

            };

            game.appendChild(card);

        });

    }


    function flipCard(card) {

        if (
            lockBoard ||
            card === firstCard ||
            card.classList.contains("matched")
        ) {

            return;

        }


        card.classList.remove("hidden");


        if (firstCard === null) {

            firstCard = card;

            return;

        }


        secondCard = card;

        lockBoard = true;


        if (
            firstCard.textContent ===
            secondCard.textContent
        ) {

            firstCard.classList.add("matched");

            secondCard.classList.add("matched");

            matches++;


            scoreText.textContent =
                "🏆 Pairs: " +
                matches +
                " / 8";


            firstCard = null;
            secondCard = null;
            lockBoard = false;


            if (matches === 8) {

                statusText.textContent =
                    "🏆 YOU FOUND ALL PAIRS!";

            }

        } else {

            setTimeout(function() {

                firstCard.classList.add("hidden");

                secondCard.classList.add("hidden");

                firstCard = null;
                secondCard = null;

                lockBoard = false;

            }, 800);

        }

    }


    function restart() {

        statusText.textContent =
            "Find all the matching pairs!";

        createGame();

    }


    createGame();

</script>
